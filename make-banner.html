<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Mob Rush Feature Graphic</title>
<style>
body{margin:0;padding:24px;background:#222;color:#fff;font-family:system-ui,sans-serif}
button{padding:12px 24px;font-size:16px;margin:6px;cursor:pointer;border:0;border-radius:8px;background:#ffd54f;color:#111;font-weight:bold}
canvas{margin:10px;border:2px solid #444;max-width:100%;height:auto}
</style></head>
<body>
<h1>Mob Rush — Feature Graphic (1024×500)</h1>
<p>Click to download, then upload to Play Console as the <b>Feature graphic</b>.</p>
<button onclick="download()">Download feature-graphic.png</button>
<h2>Preview</h2>
<canvas id="c" width="1024" height="500"></canvas>

<script>
function drawBanner(ctx, W, H) {
  // sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.6);
  sky.addColorStop(0, '#0d1030');
  sky.addColorStop(0.55, '#352660');
  sky.addColorStop(0.85, '#8b4a56');
  sky.addColorStop(1, '#c97a3e');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H * 0.6);

  // stars
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  for (let i = 0; i < 80; i++) {
    const sx = (i * 193) % W;
    const sy = (i * 97) % (H * 0.45);
    ctx.globalAlpha = 0.4 + ((i * 17) % 60) / 100;
    ctx.fillRect(sx, sy, 3, 3);
  }
  ctx.globalAlpha = 1;

  // sun
  const sunX = W * 0.72, sunY = H * 0.55;
  const sunG = ctx.createRadialGradient(sunX, sunY, 5, sunX, sunY, W * 0.35);
  sunG.addColorStop(0, 'rgba(255, 200, 140, 0.85)');
  sunG.addColorStop(0.3, 'rgba(255, 160, 90, 0.45)');
  sunG.addColorStop(1, 'rgba(255, 140, 80, 0)');
  ctx.fillStyle = sunG;
  ctx.fillRect(0, 0, W, H * 0.7);
  ctx.fillStyle = '#ffd280';
  ctx.beginPath(); ctx.arc(sunX, sunY, 26, 0, Math.PI * 2); ctx.fill();

  // far mountains
  ctx.fillStyle = '#2b2450';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.6);
  for (let x = 0; x <= W; x += 20) {
    const n = Math.sin(x * 0.013) * 28 + Math.sin(x * 0.04) * 14 + Math.sin(x * 0.08) * 6;
    ctx.lineTo(x, H * 0.6 - H * 0.2 - n);
  }
  ctx.lineTo(W, H * 0.6); ctx.closePath(); ctx.fill();
  // near mountains
  ctx.fillStyle = '#16122c';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.6);
  for (let x = 0; x <= W; x += 16) {
    const n = Math.sin(x * 0.021 + 0.6) * 18 + Math.sin(x * 0.06) * 10;
    ctx.lineTo(x, H * 0.6 - H * 0.1 - n);
  }
  ctx.lineTo(W, H * 0.6); ctx.closePath(); ctx.fill();

  // ground
  const ground = ctx.createLinearGradient(0, H * 0.6, 0, H);
  ground.addColorStop(0, '#5d3a1f');
  ground.addColorStop(0.35, '#8b6134');
  ground.addColorStop(1, '#c9a66b');
  ctx.fillStyle = ground;
  ctx.fillRect(0, H * 0.6, W, H * 0.4);

  // enemy mob cluster (right-center-rear)
  function drawChibi(cx, cy, size, color, dark, highlight) {
    const r = size;
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(cx, cy + r * 1.2, r * 1.0, r * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();
    // body
    ctx.fillStyle = dark;
    ctx.fillRect(cx - r * 0.55, cy - r * 0.1, r * 1.1, r * 1.0);
    // head
    const hg = ctx.createRadialGradient(cx - r * 0.2, cy - r * 0.85, r * 0.1, cx, cy - r * 0.65, r * 0.9);
    hg.addColorStop(0, highlight);
    hg.addColorStop(0.5, color);
    hg.addColorStop(1, dark);
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(cx, cy - r * 0.6, r * 0.75, 0, Math.PI * 2);
    ctx.fill();
    // eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx - r * 0.22, cy - r * 0.65, r * 0.11, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r * 0.22, cy - r * 0.65, r * 0.11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx - r * 0.2, cy - r * 0.62, r * 0.05, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + r * 0.25, cy - r * 0.62, r * 0.05, 0, Math.PI * 2); ctx.fill();
  }

  // Red enemy mob — stacked dense (mid-right)
  const enemyBaseX = W * 0.58;
  const enemyBaseY = H * 0.78;
  for (let row = 0; row < 5; row++) {
    for (let col = 0; col < 6; col++) {
      const x = enemyBaseX + col * 28 + (row % 2) * 14;
      const y = enemyBaseY - row * 20;
      const sz = 18 - row * 1.2;
      drawChibi(x, y, sz, '#ef5350', '#b71c1c', '#ffcdd2');
    }
  }

  // Blue ally mob (left-ish, closer to camera)
  const allyBaseX = W * 0.18;
  const allyBaseY = H * 0.9;
  for (let row = 0; row < 3; row++) {
    for (let col = 0; col < 4; col++) {
      const x = allyBaseX + col * 30;
      const y = allyBaseY - row * 22;
      const sz = 20 - row * 1.5;
      drawChibi(x, y, sz, '#42a5f5', '#0d47a1', '#90caf9');
    }
  }

  // Upgrade wall (small, on left side, behind allies)
  function drawWall(wx, wy, ww, wh, label) {
    // glow
    const glow = ctx.createRadialGradient(wx + ww / 2, wy + wh / 2, ww * 0.2, wx + ww / 2, wy + wh / 2, ww * 0.9);
    glow.addColorStop(0, 'rgba(0,229,255,0.5)');
    glow.addColorStop(1, 'rgba(0,229,255,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(wx - ww * 0.5, wy - wh * 0.3, ww * 2, wh * 1.6);
    // face
    const fg = ctx.createLinearGradient(0, wy, 0, wy + wh);
    fg.addColorStop(0, '#00e5ff'); fg.addColorStop(0.5, '#00acc1'); fg.addColorStop(1, '#00424a');
    ctx.fillStyle = fg;
    ctx.fillRect(wx, wy, ww, wh);
    // ridges
    const ridges = 6;
    for (let i = 0; i < ridges; i++) {
      const rx = wx + (i / ridges) * ww;
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(rx, wy, ww / ridges * 0.15, wh);
    }
    // border
    ctx.strokeStyle = '#b2ebf2';
    ctx.lineWidth = 3;
    ctx.strokeRect(wx, wy, ww, wh);
    // label
    ctx.font = '900 36px system-ui';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 5;
    ctx.strokeText(label, wx + ww / 2, wy + wh / 2);
    ctx.fillText(label, wx + ww / 2, wy + wh / 2);
  }
  drawWall(W * 0.04, H * 0.42, 110, 70, 'x3');
  drawWall(W * 0.85, H * 0.48, 100, 65, '+5');

  // Tank (foreground, center-bottom)
  function drawTank(x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.ellipse(0, 40 * s, 70 * s, 16 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    // wheels
    for (const wx of [-42, -14, 14, 42]) {
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(wx * s, 22 * s, 14 * s, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2a2a2a';
      ctx.beginPath(); ctx.arc(wx * s, 22 * s, 7 * s, 0, Math.PI * 2); ctx.fill();
    }
    // lower hull
    ctx.fillStyle = '#0d2a5a';
    ctx.fillRect(-48 * s, 0, 96 * s, 24 * s);
    // body
    const bg = ctx.createLinearGradient(0, -28 * s, 0, 12 * s);
    bg.addColorStop(0, '#64b5f6');
    bg.addColorStop(0.5, '#2196f3');
    bg.addColorStop(1, '#0d47a1');
    ctx.fillStyle = bg;
    ctx.fillRect(-42 * s, -24 * s, 84 * s, 40 * s);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-38 * s, -18 * s);
    ctx.lineTo(38 * s, -18 * s);
    ctx.stroke();
    // turret
    const tg = ctx.createRadialGradient(-6 * s, -14 * s, 3, 0, -10 * s, 30 * s);
    tg.addColorStop(0, '#90caf9');
    tg.addColorStop(0.6, '#1976d2');
    tg.addColorStop(1, '#0d47a1');
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.arc(0, -8 * s, 26 * s, 0, Math.PI * 2); ctx.fill();
    // barrel
    ctx.fillStyle = '#1a2a4a';
    ctx.fillRect(-8 * s, -58 * s, 16 * s, 50 * s);
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(-9 * s, -60 * s, 18 * s, 6 * s);
    // muzzle flash
    ctx.fillStyle = 'rgba(255, 240, 180, 0.9)';
    ctx.beginPath(); ctx.arc(0, -64 * s, 16 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255, 140, 60, 0.7)';
    ctx.beginPath(); ctx.arc(0, -64 * s, 10 * s, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  drawTank(W * 0.38, H * 0.82, 0.9);

  // Dark overlay behind title (left half) for legibility
  const titleBg = ctx.createLinearGradient(0, 0, W * 0.65, 0);
  titleBg.addColorStop(0, 'rgba(0,0,0,0.55)');
  titleBg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = titleBg;
  ctx.fillRect(0, 0, W * 0.65, H);

  // Title
  ctx.font = '900 96px system-ui';
  ctx.fillStyle = '#ffd54f';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 10;
  ctx.strokeText('MOB RUSH', 40, 50);
  ctx.fillText('MOB RUSH', 40, 50);

  // Tagline
  ctx.font = 'bold 28px system-ui';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 5;
  ctx.strokeText('Tank vs Endless Horde', 42, 160);
  ctx.fillText('Tank vs Endless Horde', 42, 160);

  // Small feature bullets
  ctx.font = 'bold 20px system-ui';
  ctx.fillStyle = '#a4d9ff';
  ctx.lineWidth = 4;
  const bullets = ['★ Drag to steer', '★ Stack upgrades', '★ Survive massive waves'];
  bullets.forEach((b, i) => {
    ctx.strokeText(b, 42, 210 + i * 28);
    ctx.fillText(b, 42, 210 + i * 28);
  });
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
drawBanner(ctx, 1024, 500);

function download() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 500;
  drawBanner(c.getContext('2d'), 1024, 500);
  const a = document.createElement('a');
  a.download = 'feature-graphic.png';
  a.href = c.toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
